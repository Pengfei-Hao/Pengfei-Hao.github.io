<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    
    <link rel="apple-touch-icon" href="/assets/images/touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Bootstrap CSS for responsive layout and components -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css"
        integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA=="
        crossorigin="anonymous" />
    <!-- Font Awesome for scalable vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous">
    <!-- Academicons for academic-related icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css"
        integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg=="
        crossorigin="anonymous" />
    <!-- Preconnect to Google Fonts servers to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Google Fonts: Lato and Raleway with various weights and styles -->
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Raleway:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&display=swap">

    <!-- Custom global CSS styles for the site -->
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/navbar.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/post.css' | relative_url }}">


</head>

<body class="" {{ page.body_attr }}>
    {% include navbar.html %}

    <div
        class="{% if page.container_class %}{{ page.container_class }}{% else %}container-{{ site.data.display.width }}{% endif %}">

        <div class="row">
            <div class="col">
            <div class="mt-5">

                <div class="card my-card border-0 mt-4 mx-2">
                    <div class="card-body p-4">
                        <div class="p-2">
                            <div class="mb-1">
                                <h4 class="mx-2 mt-1 pb-2 mb-2 separate-color" id="year-{{ year.name }}"> <i
                                        class="fas fa-folder-open ico-color"></i>
                                    Blog</h4>
                                <div class="mx-2 mx-{{ site.data.display.mobile_width }}-3 post">
                                    {{content}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>

        </div>


    </div>
    {% include footer.html %}

    <!-- jQuery library for DOM manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- jQuery Lazy plugin for lazy loading images -->
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
    <!-- Popper.js for tooltip & popover positioning (required by Bootstrap) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <!-- Bootstrap JS for interactive components -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js"
        integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg=="
        crossorigin="anonymous"></script>
    <!-- GitHub Buttons for rendering GitHub buttons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/github-buttons/2.14.2/buttons.min.js"
        integrity="sha512-OYwZx04hKFeFNYrWxIyo3atgGpb+cxU0ENWBZs72X7T9U+NoHPM1ftUn/Mfw7dRDXrqWA6M1wBg6z6fGE32aeA=="
        crossorigin="anonymous"></script>
    <!-- ImagesLoaded to detect when images have finished loading (works with Masonry) -->
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>


    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Custom common JavaScript for site-specific functionality -->
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <!-- Custom script for bubble visual hash effect -->
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/navbar.js' | relative_url }}"></script>
</body>

</html>
