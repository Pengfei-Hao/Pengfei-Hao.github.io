<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-{{ site.data.display.width }}{% endif %} pb-5 pt-2">
        <div class="row my-3">
            <div class="col-4">
                <div class="muted-color">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-8">
                <div class="text-right muted-color">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
