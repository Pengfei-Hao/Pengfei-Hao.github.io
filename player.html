<!DOCTYPE html>
<html lang="en" style="margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360/VR Player - Pengfei Hao</title>

    <link rel="apple-touch-icon" href="/assets/images/touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <style>
        @import 'https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css';
        @import 'https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/video-plugin@5/index.css';
        @import 'https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/settings-plugin@5/index.css';
    </style>
</head>

<body style="margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;">
    <!-- the viewer container must have a defined size -->
    <div id="viewer" style="margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;"></div>

    <script type="text/template" id="folder-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M3 4h6l2 2h10a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 4v10h16V8H3z"/>
        </svg>
    </script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
            "@photo-sphere-viewer/equirectangular-video-adapter": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/equirectangular-video-adapter@5/index.module.js",
            "@photo-sphere-viewer/video-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/video-plugin@5/index.module.js",
            "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.module.js",
            "@photo-sphere-viewer/settings-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/settings-plugin@5/index.module.js",
            "@photo-sphere-viewer/resolution-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/resolution-plugin@5/index.module.js",
            "@photo-sphere-viewer/gyroscope-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin@5/index.module.js",
            "@photo-sphere-viewer/stereo-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/stereo-plugin@5/index.module.js"
        }
    }
    </script>

    <input id="video-input" type="file" accept="video/*" multiple style="display:none;">

    <script type="module">
        import { Viewer, events } from '@photo-sphere-viewer/core';
        import { EquirectangularVideoAdapter } from '@photo-sphere-viewer/equirectangular-video-adapter';
        import { VideoPlugin } from '@photo-sphere-viewer/video-plugin';
        import { SettingsPlugin } from '@photo-sphere-viewer/settings-plugin';
        import { GyroscopePlugin } from '@photo-sphere-viewer/gyroscope-plugin';
        import { StereoPlugin } from '@photo-sphere-viewer/stereo-plugin';

        const params = new URLSearchParams(window.location.search);
        function getParam(name) {
            return decodeURIComponent(params.get(name) ?? '');
        }
        function checkParam(value, options, defaultValue) {
            return options.includes(value) ? value : defaultValue;
        }

        function mapValue(value, map, defaultValue) {
            return map.hasOwnProperty(value) ? map[value] : defaultValue;
        }

        const input = document.getElementById('video-input');

        const i18n = {
            'en-US': {
                zoom: 'Zoom',
                zoomOut: 'Zoom out',
                zoomIn: 'Zoom in',
                moveUp: 'Move up',
                moveDown: 'Move down',
                moveLeft: 'Move left',
                moveRight: 'Move right',
                description: 'Description',
                download: 'Download',
                fullscreen: 'Fullscreen',
                loading: 'Loading...',
                menu: 'Menu',
                close: 'Close',
                twoFingers: 'Use two fingers to navigate',
                ctrlZoom: 'Use ctrl + scroll to zoom the image',
                loadError: 'The panorama cannot be loaded',
                webglError: 'Your browser does not seem to support WebGL',
                videoPlay: 'Play/Pause',
                videoVolume: 'Volume',
                settings: 'Settings',
                gyroscope: 'Gyroscope',
                stereo: 'Stereo view',
                stereoNotification: 'Click anywhere to exit stereo view',
                pleaseRotate: 'Please rotate your device',
                tapToContinue: '(or tap to continue)',
                openFile: 'Open file',
                password: 'Please enter password:',
                wrong: 'Wrong password:'
            },
            'zh-CN': {
                zoom: '缩放',
                zoomOut: '缩小',
                zoomIn: '放大',
                moveUp: '向上移动',
                moveDown: '向下移动',
                moveLeft: '向左移动',
                moveRight: '向右移动',
                description: '说明',
                download: '下载',
                fullscreen: '全屏',
                loading: '加载中...',
                menu: '菜单',
                close: '关闭',
                twoFingers: '使用双指进行操作',
                ctrlZoom: '按住 Ctrl 并滚动鼠标以缩放图片',
                loadError: '全景图加载失败',
                webglError: '你的浏览器似乎不支持 WebGL',
                videoPlay: '播放/暂停',
                videoVolume: '音量',
                settings: '设置',
                gyroscope: '陀螺仪',
                stereo: '立体视图',
                stereoNotification: '点击任意位置退出立体视图',
                pleaseRotate: '请旋转你的设备',
                tapToContinue: '（或点击继续）',
                openFile: '打开文件',
                password: '请输入密码:',
                wrong: '密码错误'
            }
        };
        let langName = navigator.language;
        langName = (getParam('lang') !== '') ? getParam('lang') : langName;
        langName = checkParam(langName, ['zh-CN', 'en-US'], 'en-US');
        let lang = i18n[langName];


        let urls = params.getAll('file');
        let index = 0;
        let url = urls[index] ?? '';

        async function verifyPassword(pwd) {
            const cloud = 'https://cloud.haopf.cc/';
            try {
                const res = await fetch(cloud, {
                    method: "POST",
                    body: pwd
                });
                return res.status === 404 && await res.text() === 'File not found.';
            }
            catch (e) {
                return false;
            }
        }

        let useCloud = mapValue(getParam('cloud'), { "true": true, "false": false }, false);
        let pwd = '';
        if (useCloud) {
            pwd = getParam('pwd');
            let cancel = false;
            if (pwd === '') {
                pwd = prompt(lang.password);
                if(pwd === null) {
                    cancel = true;
                    pwd = '';
                }
            }
            while (!cancel && !await verifyPassword(pwd)) {
                pwd = prompt(lang.wrong);
                if(pwd === null) {
                    pwd = '';
                    break;
                }
            }
        }

        async function getRealUrl(file, pwd) {
            const cloud = 'https://cloud.haopf.cc/';
            let res;
            try {
                res = await fetch(cloud + file, {
                    method: "POST",
                    body: pwd
                });
            }
            catch (e) {
                return '';
            }
            if (!res.ok) {
                return '';
            }
            return await res.text();
        }

        let autoplay = mapValue(getParam('autoplay'), { "true": true, "false": false }, false);
        let muted = mapValue(getParam('muted'), { "true": true, "false": false }, false);
        let resolution = mapValue(getParam('res'), { "4": 4, "8": 8, "16": 16, "32": 32, "64": 64, "128": 128, "256": 256, "512": 512 }, 64);

        const defaultSource = '../assets/video/default.mp4';

        function getDescription() {
            return `<p>Params:</p>
                <p>Urls:</p>
                <ul>
                    ${urls.map(u => `<li><a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a></li>`).join('')}
                </ul>
                <p>Language: ${langName}</p>
                <p>Autoplay: ${autoplay}</p>
                <p>Muted: ${muted}</p>
                <p>Resolution: ${resolution}</p>
                <p>The parameters can be modified in the URL.</p>
                <p style="text-align: right;">Player by Pengfei Hao</p>`;
        }

        let viewer = new Viewer({
            container: 'viewer',
            adapter: EquirectangularVideoAdapter.withConfig({
                muted: muted,
                autoplay: autoplay,
                resolution: resolution,
            }),
            panorama: {
                source: useCloud ? await getRealUrl(url, pwd) : url,
            },
            description: getDescription(),
            minFov: 30,
            maxFov: 120,
            fisheye: false,
            mousewheelCtrlKey: false,
            touchmoveTwoFingers: false,
            navbar: [
                'video',
                'zoom',
                'gyroscope',
                'caption',
                'description',
                'stereo',
                {
                    id: 'change',
                    title: lang.openFile,
                    content: document.querySelector('#folder-icon').innerText,
                    onClick(viewer) {
                        input.value = '';
                        input.click();
                    },
                },
                'settings',
                'fullscreen',
            ],
            lang: lang,
            plugins: [
                VideoPlugin,
                SettingsPlugin,
                GyroscopePlugin,
                StereoPlugin
            ],
        });

        async function setPanorama() {
            url = urls[index] ?? '';
            viewer.setPanorama({
                source: useCloud ? await getRealUrl(url, pwd) : url
            });
        }

        input.addEventListener('change', (e) => {
            urls = [];
            index = 0;
            for (let file of e.target.files) {
                if (file) {
                    urls.push(URL.createObjectURL(file));
                }
            }
            useCloud = false;
            url = urls[index] ?? '';
            setPanorama();
            viewer.setOption('description', getDescription());
        });

        viewer.addEventListener(events.PanoramaErrorEvent.type, (e) => {
            viewer.setPanorama({
                source: defaultSource
            });
        });
        const videoPlugin = viewer.getPlugin(VideoPlugin);
        let changing = false;
        videoPlugin.addEventListener("progress", (e) => {
            const delta = 0.35; // min -> 0.269 s
            if (changing && e.time < delta) {
                changing = false;
            }
            if (!changing && e.duration - e.time < delta) {
                changing = true;
                index = (index + 1 >= urls.length) ? 0 : index + 1;
                setPanorama();
            }
        });

    </script>
</body>

</html>
